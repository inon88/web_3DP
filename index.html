<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonaStudio</title>
    <meta name="description" content="Customize parametric 3D-printable models in your browser and export STL or 3MF. Everything renders locally.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Tool library and parameters">
        <div class="brand-row">
          <img class="app-icon" src="/assets/app-icon.svg" alt="">
          <div class="brand-copy">
            <span id="appBrandName" class="brand-name">BonaStudio</span>
            <span class="brand-caption">Parametric studio</span>
          </div>
          <button id="sidebarCollapseButton" class="icon-button sidebar-collapse" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true" type="button">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 5v14"/></svg>
          </button>
        </div>

        <section class="sidebar-section library-section" aria-labelledby="libraryHeading">
          <div class="section-heading">
            <h2 id="libraryHeading">Tool library</h2>
            <span id="toolCount" class="count-badge">0</span>
          </div>
          <div class="select-wrap">
            <select id="toolSelect" aria-label="Active tool"></select>
            <svg class="select-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>
          </div>
          <p id="toolMeta" class="tool-meta"></p>
          <div class="tool-actions">
            <button id="addToolButton" class="button button-primary web-unavailable" type="button">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              Add tool
            </button>
            <button id="deleteToolButton" class="icon-button outline-icon-button danger-hover web-unavailable" type="button" aria-label="Delete tool" title="Delete tool">
              <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            </button>
          </div>
        </section>

        <section class="sidebar-section parameter-section" aria-labelledby="parameterHeading">
          <div class="section-heading">
            <h2 id="parameterHeading">Parameters</h2>
            <span id="parameterCount" class="count-badge">0</span>
            <button id="resetParamsButton" class="icon-button small-icon-button" aria-label="Restore default values" title="Restore default values" type="button">
              <svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2.3 5.7M4 5v6h6"/></svg>
            </button>
          </div>
          <div class="preset-row">
            <div class="select-wrap select-wrap-compact">
              <select id="presetSelect" aria-label="Preset"><option value="">Default values</option></select>
              <svg class="select-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>
            </div>
            <button id="savePresetButton" class="button button-secondary button-compact" type="button">Save preset</button>
            <button id="deletePresetButton" class="icon-button small-icon-button danger-hover" type="button" aria-label="Delete preset" title="Delete preset" hidden>
              <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            </button>
          </div>
          <p id="parameterHint" class="parameter-hint">Select a tool to get started</p>
          <div id="parameterList" class="parameter-list"></div>
          <button id="addParameterButton" class="add-parameter-button web-unavailable" type="button">
            <span>+</span> Add custom parameter
          </button>
        </section>

        <button id="settingsButton" class="settings-link" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7.5 7.5 0 0 0 0-3l1.4-1.1-1.5-2.6-1.7.6a7.5 7.5 0 0 0-2.6-1.5L14.3 4h-3l-.3 1.9a7.5 7.5 0 0 0-2.6 1.5l-1.7-.6-1.5 2.6L6.6 10.5a7.5 7.5 0 0 0 0 3l-1.4 1.1 1.5 2.6 1.7-.6a7.5 7.5 0 0 0 2.6 1.5l.3 1.9h3l.3-1.9a7.5 7.5 0 0 0 2.6-1.5l1.7.6 1.5-2.6L19 13.5Z"/></svg>
          <span>Settings</span>
          <kbd id="settingsShortcut" class="shortcut">Ctrl ,</kbd>
        </button>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="breadcrumb">
            <span>Library</span><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
            <strong id="breadcrumbTool">No tool selected</strong>
            <span id="breadcrumbCategory" class="category-chip" hidden></span>
          </div>
          <div class="topbar-actions">
            <span id="engineStatus" class="status-pill"><span></span> Render engine</span>
            <button id="exportButton" class="button button-primary" type="button" title="Export model (Ctrl+E)">
              <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 16v4h14v-4"/></svg>
              Export
            </button>
          </div>
        </header>

        <section class="content-area">
          <section class="viewport-card" aria-label="Model preview">
            <div class="viewport-toolbar">
              <div class="view-tabs" role="group" aria-label="Camera view">
                <button class="view-tab is-active" data-view="iso" type="button">Perspective</button>
                <button class="view-tab" data-view="front" type="button">Front</button>
                <button class="view-tab" data-view="top" type="button">Top</button>
                <button class="view-tab" data-view="right" type="button">Right</button>
              </div>
              <div class="viewport-actions">
                <div class="render-status" aria-live="polite"><span id="renderDot" class="render-dot"></span><span id="renderStatus">Ready</span></div>
                <span class="toolbar-divider"></span>
                <div id="transformTools" class="transform-tools" role="group" aria-label="Transform mode" hidden>
                  <button class="icon-button small-icon-button" data-transform-mode="translate" type="button" title="Move (G)" aria-label="Move" aria-pressed="false">
                    <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3 9 6m3-3 3 3m-3 15-3-3m3 3 3-3M3 12l3-3m-3 3 3 3m15-3-3-3m3 3-3 3"/></svg>
                  </button>
                  <button class="icon-button small-icon-button" data-transform-mode="rotate" type="button" title="Rotate (R)" aria-label="Rotate" aria-pressed="false">
                    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
                  </button>
                  <button class="icon-button small-icon-button" data-transform-mode="scale" type="button" title="Scale (S)" aria-label="Scale" aria-pressed="false">
                    <svg viewBox="0 0 24 24"><path d="M4 14v6h6M20 10V4h-6M4 20l7-7m9-9-7 7"/></svg>
                  </button>
                </div>
                <span id="transformDivider" class="toolbar-divider" hidden></span>
                <button id="focusButton" class="icon-button small-icon-button" type="button" title="Frame model (F)" aria-label="Frame model">
                  <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/><circle cx="12" cy="12" r="4"/></svg>
                </button>
                <button id="gridButton" class="icon-button small-icon-button is-selected" type="button" title="Show grid (G)" aria-label="Show grid" aria-pressed="true">
                  <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg>
                </button>
                <select id="plateLayout" class="toolbar-select" title="Build plates (256 × 256 mm each)" aria-label="Build plates"></select>
                <button id="renderButton" class="button button-secondary button-compact" type="button" title="Render preview (Ctrl+Enter)">
                  <svg class="filled-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>
                  Render preview
                </button>
              </div>
            </div>

            <div id="viewport" class="viewport">
              <canvas id="previewCanvas"></canvas>
              <div id="emptyState" class="empty-state">
                <div class="empty-icon">
                  <svg viewBox="0 0 64 64"><path d="m32 7 23 13v25L32 58 9 45V20L32 7Z"/><path d="m9 20 23 14 23-14M32 34v24"/></svg>
                </div>
                <strong id="emptyTitle">Preview</strong>
                <span id="emptyMessage">Select a tool to get started.</span>
                <div id="emptyActions" class="empty-actions"></div>
              </div>
              <div id="viewportNotice" class="viewport-notice" role="alert" hidden></div>
              <div id="activeObjectChip" class="active-object-chip" hidden><span class="active-object-dot"></span><span>Active</span><strong id="activeObjectName"></strong></div>
              <div id="transformHud" class="transform-hud" role="status" aria-live="polite" hidden></div>
              <div id="viewHelp" class="view-help"><kbd>Middle drag</kbd> Orbit <kbd>Shift + middle drag</kbd> Pan <kbd>Scroll</kbd> Zoom</div>
            </div>

            <div class="viewport-footer">
              <div class="footer-group"><span class="footer-label">Size</span><span id="meshSize">—</span></div>
              <div class="footer-group"><span id="triangleCount">—</span><span class="footer-separator"></span><span id="renderTime">—</span><span class="footer-separator"></span><span>Units: mm</span></div>
            </div>
          </section>
        </section>

        <footer class="statusbar">
          <div><span id="statusDot" class="statusbar-dot"></span><span id="statusMessage">Starting…</span></div>
          <div><span id="exportFolderStatus" class="statusbar-link web-unavailable" role="button" tabindex="0" title="Change default export folder">Export folder: Desktop</span><span class="statusbar-separator"></span><span id="appVersion">BonaStudio</span></div>
        </footer>
      </main>
    </div>

    <div id="modalLayer" class="modal-layer" hidden>
      <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
    </div>
    <div id="toastRegion" class="toast-region" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
